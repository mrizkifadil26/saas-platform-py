[project]
name = "billing"
version = "0.1.0"
description = ""
authors = [
    { name = "Muhammad Rizki Fadillah", email = "mrizkifadil26@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "fastapi (>=0.136.0,<0.137.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
]

[tool.poetry]
packages = [{ include = "billing", from = "src" }]

[tool.poetry.group.dev.dependencies]
mypy = "^1.8.0"
pytest = "^8.0.0"
pytest-cov = "^7.1.0"
ruff = "^0.15.11"

[tool.poetry.dependencies]
db = { path = "/home/mrizkifadil26/px-projects/py-px/packages/shared/db", develop = true }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 60

[tool.ruff.lint]
select = [
    "I",    # import sorting (isort replacement)
    "F401", # unused imports
    "F822", # undefined name in __all__
    "F403", # import * usage
    "F405", # name from import * not defined
    "RUF",  # Ruff-specific rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=billing --cov-report=term-missing --cov-report=html"

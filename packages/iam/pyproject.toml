[project]
name = "iam"
version = "0.1.0"
description = ""
authors = [
    { name = "Muhammad Rizki Fadillah", email = "mrizkifadil26@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "db",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = ["ruff (>=0.15.12,<0.16.0)", "deptry>=0.25.1"]

test = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
src = [".", "src"]

[tool.ruff.lint]
select = [
    "I",    # import sorting (isort replacement)
    "F401", # unused imports
    "F822", # undefined name in __all__
    "F403", # import * usage
    "F405", # name from import * not defined
    "RUF",  # Ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["iam", "db"]
force-single-line = false
combine-as-imports = true
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.deptry]
known_first_party = ["iam", "db", "tests",]

[tool.uv.sources]
db = { workspace = true }

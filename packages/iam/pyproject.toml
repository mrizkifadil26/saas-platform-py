[project]
name = "iam"
version = "0.1.0"
description = ""
authors = [
    { name = "Muhammad Rizki Fadillah", email = "mrizkifadil26@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "db (>=0.1.1,<0.2.0)",
    "db @ file:///home/mrizkifadil26/projects/px-project/py-px/packages/shared/db",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "redis (>=7.4.0,<8.0.0)",
]

[tool.poetry]
packages = [{ include = "iam", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "I",    # import sorting (isort replacement)
    "F401", # unused imports
    "F822", # undefined name in __all__
    "F403", # import * usage
    "F405", # name from import * not defined
    "RUF",  # Ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["iam", "db"]
force-single-line = false
combine-as-imports = true
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = ["ruff (>=0.15.12,<0.16.0)", "pytest (>=9.0.3,<10.0.0)"]

[tool.pytest.ini_options]
pythonpath = ["packages/iam/src"]
testpaths = ["packages/iam/tests"]

[project]
name = "db"
version = "0.1.0"
description = ""
authors = [
    { name = "Muhammad Rizki Fadillah", email = "mrizkifadil26@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy (>=2.0.46,<3.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "ruff (>=0.15.11,<0.16.0)",
]
test = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "aiosqlite (>=0.21.0,<0.22.0)",
]

[tool.pytest.ini_options]
markers = [
    "db: tests that require a real database",
    "migration: tests related to database migrations",
]

[tool.coverage.run]
branch = true
source = ["db"]

[tool.coverage.report]
show_missing = true
skip_empty = true

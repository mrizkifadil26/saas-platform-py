[project]
name = "db"
version = "0.1.0"
description = ""
authors = [
    { name = "Muhammad Rizki Fadillah", email = "mrizkifadil26@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy (>=2.0.46,<3.0.0)",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "python-dotenv (>=1.2.1,<2.0.0)",
    "aiosqlite (>=0.21.0,<0.22.0)",
]

[tool.pytest.ini_options]
markers = [
    "db: tests that require a real database",
    "migration: tests related to database migrations",
]

[tool.coverage.run]
branch = true
source = ["db"]

[tool.coverage.report]
show_missing = true
skip_empty = true

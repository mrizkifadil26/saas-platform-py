[project]
name = "db"
version = "0.1.0"
description = ""
authors = [
    { name = "Muhammad Rizki Fadillah", email = "mrizkifadil26@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "alembic (>=1.18.2,<2.0.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "psycopg[binary] (>=3.3.2,<4.0.0)",
]

[tool.poetry]
packages = [{ include = "db", from = "src" }]
include = ["src/db/py.typed"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["ruff (>=0.15.11,<0.16.0)"]
test = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "aiosqlite (>=0.21.0,<0.22.0)",
    "alembic (>=1.18.4,<2.0.0)",
]

[tool.pytest.ini_options]
markers = [
    "db: tests that require a real database",
    "migration: tests related to database migrations",
]

[tool.coverage.run]
branch = true
source = ["db"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.poetry]
name = "taskqueue"
version = "0.1.0"
packages = [{ include = "taskqueue", from = "src" }]
include = ["src/taskqueue/py.typed"]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.6"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.14"

[tool.poetry.group.test.dependencies]
pytest = "^8.0"
pytest-cov = "^7.0.0"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

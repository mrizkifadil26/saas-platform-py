[project]
name = "api"
version = "0.1.0"
description = ""
authors = [
    {name = "Muhammad Rizki Fadillah",email = "mrizkifadil26@gmail.com"}
]
requires-python = "^3.11"
dependencies = [
    "psycopg[binary] (>=3.3.2,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "api"
version = "0.1.0"
packages = [{ include = "api", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110"
uvicorn = { extras = ["standard"], version = "^0.27" }

# 👇 monorepo dependency
common = { path = "../../packages/common", develop = true }
db = { path = "../../packages/db", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.6"
